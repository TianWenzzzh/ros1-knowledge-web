<script>
(function(){
'use strict';
const params = new URLSearchParams(location.search);
const id = params.get('id') || 'linux-basics';
const fromExp = params.get('from') === 'exp';
const art = window.__ARTICLES__[id];

/* 文章ID -> 实验ID映射 */
const ART_TO_EXP = {
  'ubuntu-setup':'exp-01','ros-topic':'exp-02','catkin-workspace':'exp-03',
  'ros-publisher-subscriber':'exp-04','ros-service':'exp-05','tf-transform':'exp-06',
  'ros-launch':'exp-07','slam-navigation':'exp-08'
};
const expId = ART_TO_EXP[id];

function getExpDone(){ try{return new Set(JSON.parse(localStorage.getItem('ros1-experiments')||'[]'));}catch(e){return new Set();} }
function setExpDone(s){ try{localStorage.setItem('ros1-experiments', JSON.stringify([...s]));}catch(e){} }
const expAlreadyDone = expId && getExpDone().has(expId);

if(!art){
  document.getElementById('content').innerHTML = '<div class="art-header"><h1 class="art-title">页面未找到</h1><p class="art-desc">该文章不存在或已移除。<a href="map.html">返回知识星图</a></p></div>';
  document.title = '404 - ROS1 知识库';
  return;
}
document.title = art.t + ' - ROS1 知识库';

/* 面包屑 */
const catMap = {'linux':'🐧 Linux/Ubuntu','code':'💻 编程基础','score':'🤖 ROS 基础','comm':'📡 通信机制','comm-code':'🛰️ 通信编程','tool':'🔧 工具链','tf':'📐 坐标与模型','extra':'📌 补充'};
const crumb = `<div class="art-crumbs"><a href="index.html">首页</a> / <a href="map.html">知识星图</a> / ${catMap[art.cat]||art.cat} / ${art.t}</div>`;

/* 标签 */
const lvNames = ['入门','进阶','高级'];
const lvCls = ['lv-0','lv-1','lv-2'];
const preTxt = art.pre>0 ? `<span class="pre">前置知识 ${art.pre} 项</span>` : '<span class="pre">无需前置知识</span>';

/* 正文 */
document.getElementById('content').innerHTML = `
  <article>
  <div class="art-header">
    ${crumb}
    <h1 class="art-title">${art.t}</h1>
    <div class="art-meta">
      <span class="tag ${lvCls[art.lv]}">${lvNames[art.lv]}</span>
      ${preTxt}
      <span>⏱️ ${art.time||'15-30 分钟'}</span>
      <span title="完成阅读解锁成就">🏅 阅读解锁成就</span>
    </div>
    ${art.desc?`<p class="art-desc">${art.desc}</p>`:''}
  </div>
  <div class="prose" id="prose">${art.body}</div>
  <div class="art-end-card">
    <div class="aec-ic">🎉</div>
    <div class="aec-body">
      <div class="aec-title">恭喜你读完这篇！</div>
      <div class="aec-desc">知识又增加了。继续探索，解锁更多成就徽章～</div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      ${fromExp && expId ? `<a class="aec-btn exp-complete-btn" href="javascript:void(0)" id="exp-done-btn" style="background:linear-gradient(120deg,#f59e0b,#fb7185);color:#fff;font-weight:700">${expAlreadyDone?'✓ 已完成实验':'🎯 完成此实验 →'}</a>` : ''}
      <a class="aec-btn" href="javascript:void(0)" data-random>🎲 随机来一篇</a>
      ${fromExp ? '<a class="aec-btn" href="experiments.html">🔬 返回实验</a>' : ''}
      <a class="aec-btn" href="map.html">🌌 知识星图</a>
      <a class="aec-btn" href="my-learning.html">📊 我的进度</a>
    </div>
  </div>
  <div class="art-nav" id="art-nav"></div>
  </article>
`;

/* 标记已读 */
window.__KB__.markRead('article.html?id='+id);

/* 左侧边栏（分类文章列表） */
const cats = [];
Object.entries(window.__ARTICLES__).forEach(([aid,a])=>{
  if(a.hidden) return;
  let c = cats.find(x=>x.cat===a.cat);
  if(!c){ c={cat:a.cat,name:catMap[a.cat]||a.cat,items:[]}; cats.push(c); }
  c.items.push({id:aid,...a});
});
const sb = document.getElementById('sidebar');
sb.innerHTML = cats.map(c=>`<div class="side-sec"><h5>${c.name}</h5>${c.items.map(x=>`<a class="side-link ${x.id===id?'on':''} ${window.__KB__.isRead(x.id)?'read':''}" data-id="${x.id}" href="article.html?id=${x.id}"><span class="lv ${lvCls[x.lv]}">${lvNames[x.lv]}</span>${x.t}<span class="read-dot"></span></a>`).join('')}</div>`).join('');

/* 右侧TOC */
const prose = document.getElementById('prose');

/* 自动注入趣味提示框 */
const didYouKnow = [
  '🐢 ROS 的吉祥物是一只小海龟，这就是为什么每个初学者都要先跑 turtlesim_node——它是你的第一个机器人伙伴！',
  '🌌 roscore 就像机器人的"中央大脑"，所有节点都要先向它报到才能互相通信。没了它，节点们就是一群迷路的小机器人。',
  '📡 ROS 的话题通信是"发布-订阅"模式，就像你关注了一个B站UP主——UP主发视频（publish），粉丝自动收到（subscribe）。',
  '🔧 catkin_make 编译时，它会自动找到所有功能包并生成依赖关系图，比你手动写Makefile聪明多了。',
  '🎯 TF 坐标变换是ROS最巧妙的设计之一。你只需要发布一次坐标关系，整个系统都能随时查询"这个物体在那个坐标系下在哪里"。',
  '💡 ROS 节点之间可以用不同语言编写——一个用Python写视觉，一个用C++写控制，它们能无缝通信，因为消息格式是语言无关的。',
  '🚗 全球顶级的自动驾驶和机器人公司（包括波士顿动力、特斯拉早期、百度Apollo）都曾基于ROS做原型验证。',
  '📦 rosbag 就像机器人的"录像机"，能把所有传感器数据录下来反复回放。没有它，调试机器人就像闭着眼睛修东西。',
  '🤖 ROS 里的 Action 机制是为"长任务"设计的——比如让机器人导航到某个点，你可以随时取消、收到进度反馈，这是Service做不到的。',
  '🌍 ROS 社区维护了上万个功能包，从机械臂控制到SLAM建图再到人脸识别，几乎你能想到的机器人功能都有人做过了。',
];
const tips = [
  '💡 学习ROS最好的方式不是看书，而是动手敲代码。每看完一节，立即打开终端敲一遍命令！',
  '💡 遇到报错不要慌！90%的ROS错误都可以通过：①source devel/setup.bash ②检查roscore是否运行 ③检查话题名是否拼写正确 来解决。',
  '💡 建议每次打开终端都自动source工作空间，把 source ~/catkin_ws/devel/setup.bash 写到 ~/.bashrc 末尾。',
  '💡 用 rqt_graph 可视化节点关系图，能帮你快速理解整个ROS系统是怎么连接的，是排错神器。',
  '💡 写ROS节点时记得在CMakeLists.txt里正确配置依赖，否则编译会报找不到头文件/库的错误。',
  '💡 roslaunch 可以同时启动多个节点、设置参数、甚至自动启动roscore，比一个个rosrun高效多了。',
];
const warn = [
  '⚠️ ROS1 已经停止维护（2025年5月），但作为学习机器人操作系统原理的起点依然非常合适。学完ROS1再学ROS2会轻松很多。',
  '⚠️ 不要在root用户下运行ROS！这会导致权限问题，而且非常不安全。始终用普通用户操作。',
  '⚠️ 自定义消息类型后，必须重新catkin_make并source环境变量，否则Python/C++都找不到新消息类型。',
];

function injectCallouts(){
  const h2s = prose.querySelectorAll('h2');
  if(h2s.length >= 2){
    /* 在第二个h2前插入一个"你知道吗" */
    const fact = didYouKnow[Math.floor(Math.random()*didYouKnow.length)];
    const div = document.createElement('div');
    div.className = 'callout callout-didyouknow';
    div.innerHTML = `<span class="c-ic">💡</span><span class="c-body"><b>你知道吗？</b>${fact}</span>`;
    h2s[1].parentNode.insertBefore(div, h2s[1]);
  }
  /* 在文章中间插入一个小贴士 */
  if(h2s.length >= 3){
    const tip = tips[Math.floor(Math.random()*tips.length)];
    const div = document.createElement('div');
    div.className = 'callout callout-tip';
    div.innerHTML = `<span class="c-ic">✨</span><span class="c-body"><b>小贴士：</b>${tip}</span>`;
    const mid = Math.floor(h2s.length/2);
    h2s[mid].parentNode.insertBefore(div, h2s[mid]);
  }
  /* 特定文章加警告 */
  if(id==='ros-architecture' || id==='ros1-to-ros2'){
    const w = warn[0];
    const div = document.createElement('div');
    div.className = 'callout callout-warn';
    div.innerHTML = `<span class="c-ic">⚠️</span><span class="c-body"><b>注意：</b>${w}</span>`;
    prose.insertBefore(div, prose.firstChild.nextSibling);
  }
}
injectCallouts();

/* 鼠标跟随光效（实验/命令卡片） */
document.querySelectorAll('.exp-card').forEach(card=>{
  card.addEventListener('mousemove', e=>{
    const r = card.getBoundingClientRect();
    card.style.setProperty('--mx', ((e.clientX-r.left)/r.width*100)+'%');
    card.style.setProperty('--my', ((e.clientY-r.top)/r.height*100)+'%');
  });
});

const hs = [...prose.querySelectorAll('h2')];
const toc = document.getElementById('toc');
if(hs.length>0){
  toc.innerHTML = '<h5>本页目录</h5>' + hs.map((h,i)=>{
    const hid = 'sec-'+i; h.id=hid;
    return `<a href="#${hid}">${h.textContent.replace(/^[#▶\s]+/,'')}</a>`;
  }).join('');
  setTimeout(()=>window.__KB__ && window.dispatchEvent(new Event('scroll')), 100);
}

/* 上下篇 */
const order = Object.keys(window.__ARTICLES__).filter(k=>!window.__ARTICLES__[k].hidden);
const idx = order.indexOf(id);
const nav = document.getElementById('art-nav');
let navHtml = '';
if(idx>0){
  const p = window.__ARTICLES__[order[idx-1]];
  navHtml += `<a href="article.html?id=${order[idx-1]}"><div class="dir">← 上一篇</div><div class="ttl">${p.t}</div></a>`;
}
if(idx<order.length-1){
  const n = window.__ARTICLES__[order[idx+1]];
  navHtml += `<a class="next" href="article.html?id=${order[idx+1]}"><div class="dir">下一篇 →</div><div class="ttl">${n.t}</div></a>`;
}
nav.innerHTML = navHtml;

/* 搜索索引增强 */
window.__SEARCH_INDEX__ = Object.entries(window.__ARTICLES__).filter(([,a])=>!a.hidden).map(([aid,a])=>({t:a.t,u:'article.html?id='+aid,p:catMap[a.cat]||'文章',d:a.desc||''}));

/* 完成实验按钮 */
const expBtn = document.getElementById('exp-done-btn');
if(expBtn){
  expBtn.addEventListener('click', ()=>{
    if(expAlreadyDone){
      /* 取消完成 */
      const s = getExpDone(); s.delete(expId); setExpDone(s);
      expBtn.innerHTML = '🎯 完成此实验 →';
      expBtn.style.background = 'linear-gradient(120deg,#f59e0b,#fb7185)';
    }else{
      /* 标记完成 */
      const s = getExpDone(); s.add(expId); setExpDone(s);
      expBtn.innerHTML = '✓ 已完成实验！';
      expBtn.style.background = 'linear-gradient(120deg,#22c55e,#10b981)';
      /* 庆祝动画 */
      expBtn.animate([
        {transform:'scale(1)'},
        {transform:'scale(1.15)'},
        {transform:'scale(1)'}
      ],{duration:500,easing:'cubic-bezier(.2,.9,.3,1.3)'});
      /* 2秒后跳回实验页 */
      setTimeout(()=>{ location.href = 'experiments.html?completed='+expId; }, 1200);
    }
  });
}
})();
</script>
