<script>
(function(){
'use strict';

const CAT_MAP = {
  'linux':'🐧 Linux基础',
  'code':'💻 编程基础',
  'score':'🤖 ROS基础',
  'comm':'📡 通信机制',
  'comm-code':'🛰️ 通信编程',
  'tool':'🔧 工具链',
  'tf':'📐 坐标与模型',
  'extra':'📌 补充进阶'
};
const CAT_ORDER = ['linux','code','score','comm','comm-code','tool','tf','extra'];
const LV_NAMES = ['入门','进阶','高级'];
const READ_KEY = 'ros1-read-v2';
const EXP_KEY = 'ros1-experiments';
const ACH_KEY = 'ros1-achievements-v1';
const TOTAL_ARTICLES = 23;

function getReadSet(){
  try{ return new Set(JSON.parse(localStorage.getItem(READ_KEY)||'[]')); }catch(e){ return new Set(); }
}
/* 兼容检查：readSet中可能存裸ID('linux-basics')或完整URL('article.html?id=linux-basics') */
function isRead(s, id){
  return s.has(id) || s.has('article.html?id='+id);
}
function getExpSet(){
  try{ return new Set(JSON.parse(localStorage.getItem(EXP_KEY)||'[]')); }catch(e){ return new Set(); }
}
function getAch(){
  try{ return JSON.parse(localStorage.getItem(ACH_KEY)||'{}'); }catch(e){ return {}; }
}

const ACHIEVEMENTS = window.__KB__ && window.__KB__.ACHIEVEMENTS || [
  {id:'first-step',name:'启程',desc:'阅读第一篇文章',icon:'🌱'},
  {id:'explorer',name:'探索者',desc:'阅读5篇文章',icon:'🔭'},
  {id:'scholar',name:'学者',desc:'阅读10篇文章',icon:'📚'},
  {id:'master',name:'ROS大师',desc:'阅读全部23篇文章',icon:'🏆'},
  {id:'commander',name:'指挥官',desc:'打开知识星图',icon:'🌌'},
  {id:'experimenter',name:'实验家',desc:'进入动手实验页面',icon:'🔬'},
  {id:'commander-cmd',name:'终端指挥官',desc:'使用命令速查',icon:'⚡'},
  {id:'detective',name:'侦探',desc:'查看错误排查',icon:'🔍'},
  {id:'searcher',name:'搜索专家',desc:'使用⌘K搜索3次',icon:'🔎'},
  {id:'marathon',name:'马拉松',desc:'单篇文章阅读到底部',icon:'🏃'},
  {id:'sound-on',name:'沉浸模式',desc:'开启环境音效',icon:'🔊'},
  {id:'konami',name:'黑客入侵',desc:'输入Konami秘籍',icon:'🕵️'},
];

function getArticles(){
  const all = window.__ARTICLES__ || {};
  return Object.entries(all).filter(([,a])=>!a.hidden).map(([id,a])=>({id,...a}));
}

function getStage(count){
  if(count<3) return {name:'刚入门',emoji:'🌱'};
  if(count<=8) return {name:'学习中',emoji:'📚'};
  if(count<=15) return {name:'进阶中',emoji:'🚀'};
  if(count<=21) return {name:'高级',emoji:'🎯'};
  return {name:'大师',emoji:'🏆'};
}

function getSuggestion(pct, readSet, articles){
  if(pct>=100) return '恭喜你已完成全部文章！<b>你是ROS1大师 🏆</b>，可以尝试做实验项目巩固知识，或前往 <a href="article.html?id=ros1-to-ros2" style="color:var(--teal)">ROS1→ROS2迁移</a> 学习ROS2。';
  if(pct<20){
    const first = articles.find(a=>a.id==='linux-basics');
    const t = first ? first.t : 'Linux基础命令与操作';
    return '欢迎开始ROS1学习之旅！建议从 <b><a href="article.html?id=linux-basics" style="color:var(--teal)">'+t+'</a></b> 开始，打好Linux命令行基础是第一步。';
  }
  if(pct<50){
    const core = articles.find(a=>a.cat==='comm' && !isRead(readSet,a.id));
    if(core) return '进度不错！建议继续深入 <b><a href="article.html?id='+core.id+'" style="color:var(--teal)">'+core.t+'</a></b>，通信机制是ROS的核心。';
    return '继续加油！按顺序阅读核心通信相关文章，扎实掌握话题、服务、参数等机制。';
  }
  if(pct<80){
    const adv = articles.find(a=>a.cat==='tf' && !isRead(readSet,a.id)) || articles.find(a=>!isRead(readSet,a.id));
    if(adv) return '你已进入进阶阶段！推荐学习 <b><a href="article.html?id='+adv.id+'" style="color:var(--teal)">'+adv.t+'</a></b>，坐标变换是机器人导航与操控的关键。';
    return '进阶学习中，继续攻克工具链和坐标变换等高级主题。';
  }
  const last = articles.find(a=>!isRead(readSet,a.id));
  if(last) return '即将成为大师！只剩最后几篇了，下一篇：<b><a href="article.html?id='+last.id+'" style="color:var(--teal)">'+last.t+'</a></b>。';
  return '马上就要完成全部学习了，加油！';
}

function formatTimeAgo(ts){
  if(!ts) return '';
  const diff = Date.now() - ts;
  const m = Math.floor(diff/60000);
  if(m<1) return '刚刚';
  if(m<60) return m+'分钟前';
  const h = Math.floor(m/60);
  if(h<24) return h+'小时前';
  const d = Math.floor(h/24);
  if(d<30) return d+'天前';
  const mo = Math.floor(d/30);
  if(mo<12) return mo+'个月前';
  return Math.floor(mo/12)+'年前';
}

/* 渲染统计卡片 */
function renderStats(articles, readSet, expSet){
  const readCount = articles.filter(a=>isRead(readSet,a.id)).length;
  const total = articles.length;
  const pct = total>0 ? Math.round(readCount/total*100) : 0;
  const stage = getStage(readCount);
  const KB = window.__KB__ || {};
  const recent = KB.getRecentArticles ? KB.getRecentArticles(articles, 1)[0] : null;
  const recentTime = (recent && KB.getReadTime) ? KB.getReadTime(recent.id) : 0;
  const expDone = expSet.size;

  const recentHtml = recent
    ? `<a class="recent-link" href="article.html?id=${recent.id}" title="${recent.t}${recentTime?' · '+formatTimeAgo(recentTime):''}">${recent.t}</a>${recentTime?`<div style="font-size:11px;color:var(--ink-faint);margin-top:2px">${formatTimeAgo(recentTime)}</div>`:''}`
    : `<div class="recent-none">暂无记录</div>`;

  document.getElementById('statRow').innerHTML = `
    <div class="stat-card">
      <div class="num">${readCount}<span style="font-size:18px;color:var(--ink-faint);-webkit-text-fill-color:var(--ink-faint)"> / ${total}</span></div>
      <div class="lbl">已读文章</div>
    </div>
    <div class="stat-card">
      <div class="num">${pct}%</div>
      <div class="lbl">阅读进度</div>
    </div>
    <div class="stat-card">
      <div class="num" style="font-size:22px">${expDone}<span style="font-size:16px;color:var(--ink-faint);-webkit-text-fill-color:var(--ink-faint)">/8</span></div>
      <div class="lbl">完成实验</div>
    </div>
    <div class="stat-card">
      <div class="num stage-text">${stage.emoji} ${stage.name}</div>
      <div class="lbl">学习阶段</div>
    </div>
    <div class="stat-card">
      <div class="num" style="font-size:14px;-webkit-text-fill-color:var(--ink-dim)">最近阅读</div>
      ${recentHtml}
    </div>
  `;
  return {readCount, total, pct};
}

/* 渲染成就徽章墙 */
function renderBadges(ach, readCount, expSet){
  const unlocked = Object.keys(ach).length;
  document.getElementById('achCount').textContent = `(${unlocked}/${ACHIEVEMENTS.length})`;
  document.getElementById('badgeWall').innerHTML = ACHIEVEMENTS.map(a=>{
    const got = !!ach[a.id];
    return `<div class="badge ${got?'unlocked':''}" title="${got?'已解锁：'+a.desc:'未解锁：'+a.desc}">
      <div class="b-ic">${got?a.icon:'🔒'}</div>
      <div class="b-name">${a.name}</div>
      <div class="b-desc">${a.desc}</div>
    </div>`;
  }).join('');
}

/* 绘制进度环 */
function drawRing(pct){
  const canvas = document.getElementById('ringCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2;
  const r = 160, lw = 20;
  ctx.clearRect(0,0,W,H);

  // 背景轨道
  ctx.beginPath();
  ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.strokeStyle = 'rgba(94,234,212,.08)';
  ctx.lineWidth = lw;
  ctx.lineCap = 'round';
  ctx.stroke();

  // 进度弧 - 颜色从cyan渐变到green
  const angle = (pct/100)*Math.PI*2 - Math.PI/2;
  if(pct>0){
    const t = pct/100;
    // cyan #22d3ee -> green #4ade80
    const r1=34+Math.round((74-34)*t), g1=211+Math.round((222-211)*t), b1=238+Math.round((128-238)*t);
    const grad = ctx.createLinearGradient(cx-r,cy-r,cx+r,cy+r);
    grad.addColorStop(0,`rgb(${r1},${g1},${b1})`);
    grad.addColorStop(1,'#4ade80');

    ctx.beginPath();
    ctx.arc(cx,cy,r,-Math.PI/2,angle);
    ctx.strokeStyle = grad;
    ctx.lineWidth = lw;
    ctx.lineCap = 'round';
    ctx.shadowColor = 'rgba(74,222,128,.5)';
    ctx.shadowBlur = 18;
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  document.getElementById('ringPct').textContent = pct+'%';
  // 数字颜色也渐变
  const pctEl = document.getElementById('ringPct');
  const t2 = pct/100;
  pctEl.style.background = `linear-gradient(120deg,#22d3ee,rgb(${34+Math.round((74-34)*t2)},${211+Math.round((222-211)*t2)},${238+Math.round((128-238)*t2)}))`;
  pctEl.style.webkitBackgroundClip = 'text';
  pctEl.style.webkitTextFillColor = 'transparent';
  pctEl.style.backgroundClip = 'text';
}

/* 渲染分类文章列表 */
function renderCats(articles, readSet){
  const cats = {};
  CAT_ORDER.forEach(c=>{ cats[c]={name:CAT_MAP[c],items:[]}; });
  articles.forEach(a=>{
    if(!cats[a.cat]) cats[a.cat] = {name:a.cat,items:[]};
    cats[a.cat].items.push(a);
  });

  let html = '';
  CAT_ORDER.forEach(cat=>{
    const c = cats[cat];
    if(!c || c.items.length===0) return;
    const doneCount = c.items.filter(a=>isRead(readSet,a.id)).length;
    html += `<div class="cat-block">
      <div class="cat-title">${c.name}<span class="cat-count">${doneCount}/${c.items.length}</span></div>
      <div class="art-list">`;
    c.items.forEach(a=>{
      const done = isRead(readSet,a.id);
      html += `<a class="art-item ${done?'done':''}" href="article.html?id=${a.id}">
        <span class="check">${done?'✓':''}</span>
        <span class="t">${a.t}</span>
        <span class="lv lv-${a.lv}">${LV_NAMES[a.lv]}</span>
      </a>`;
    });
    html += `</div></div>`;
  });

  document.getElementById('catsSection').innerHTML = html;
}

/* 渲染建议 */
function renderSuggestion(articles, readSet, pct){
  const box = document.getElementById('suggestBox');
  box.innerHTML = getSuggestion(pct, readSet, articles);
}

/* 重置 */
function initReset(){
  document.getElementById('resetBtn').addEventListener('click',()=>{
    if(!confirm('确定要重置所有学习进度吗？此操作不可撤销。')) return;
    try{
      // 清空所有 ros1 相关 localStorage 数据
      const keysToRemove = [];
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.startsWith('ros1-')) keysToRemove.push(k);
      }
      keysToRemove.forEach(k=>localStorage.removeItem(k));
    }catch(e){}
    location.reload();
  });
}

/* 主初始化 */
function init(){
  const articles = getArticles();
  const readSet = getReadSet();
  const expSet = getExpSet();
  const ach = getAch();
  const {pct} = renderStats(articles, readSet, expSet);
  drawRing(pct);
  renderBadges(ach, readSet.size, expSet);
  renderCats(articles, readSet);
  renderSuggestion(articles, readSet, pct);
  initReset();

  // 搜索索引增强
  window.__SEARCH_INDEX__ = (window.__SEARCH_INDEX__||[]).concat(
    articles.map(a=>({t:a.t,u:'article.html?id='+a.id,p:CAT_MAP[a.cat]||'文章',d:a.desc||''}))
  );
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', init);
}else{
  init();
}
})();
</script>
